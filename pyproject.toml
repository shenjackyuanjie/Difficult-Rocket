[project]
name = "difficult-rocket"
description = "A rocket game"
authors = [
    { name = "shenjackyuanjie", email = "3695888@qq.com" }
]
requires-python = ">=3.8"
license = { text = "MPL-2.0" }
readme = "README.md"
version = "0.1.0"
dependencies = [
    "defusedxml>=0.7.1",
    "lib-not-dr",
    "pillow>=10.4.0 ; (python_full_version >= '3.9' and python_full_version < '3.13' and platform_python_implementation == 'PyPy') or platform_python_implementation == 'CPython'",
    "psutil>=6.1.1",
    "pyglet",
    "tomli>=2.0.2",
    "tomli-w>=1.0.0",
]

[dependency-groups]
dev = [
    "objprint>=0.2.3",
    "vizplugins>=0.1.3 ; platform_python_implementation != 'PyPy'",
    "viztracer>=0.16.3 ; platform_python_implementation != 'PyPy'",
]
build = [
    "nuitka>=2.6",
    "imageio>=2.34.2",
    "setuptools>=69",
    "setuptools-rust>=1.10.2",
    "wheel>=0.43.0",
]

[tool.uv.sources]
lib-not-dr = { git = "https://github.com/shenjackyuanjie/lib-not-dr", rev = "a1c3fb" }
pyglet = { git = "https://github.com/shenjackyuanjie/pyglet", rev = "47e315" }

[tool.uv.extra-build-dependencies]
difficult-rocket = ["lib_not_dr"]

[tool.setuptools]
packages = []

[tool.setuptools.dynamic]
version = { attr = "Difficult_Rocket.__version__" }

[tool.pyright]
include = ["Difficult_Rocket", "libs/utils", "mods"]
exclude = [
    'libs/pyperclip',
    'libs/MCDR',
    'libs/xmltodict',
]
pythonVersion = "3.8"

[tool.ruff]
target-version = "py38"
line-length = 90
src = ["Difficult_Rocket", "libs/utils", "mods"]
exclude = [
    'libs/pyperclip',
    'libs/MCDR',
    'libs/xmltodict',
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "W", # pycodestyle
]
ignore = ["I001"]  # do not sort my imports

[tool.lndl.nuitka]
script = 'scripts/lndl-config.py'

[tool.lndl.nuitka.cli]
main = "DR.py"

lto = "yes"
clang = false
msvc = "latest"
mingw64 = false

standalone = true
output-dir = "build\\nuitka"

run = false
# auto run after build
show-memory = false
show-progress = false
disable-console = false
assume-yes-for-download = true

company-name = 'tool-shenjack-workshop'
product-name = 'Difficult Rocket'
file-version = false  # require script
product-version = false  # require script
macos-app-version = false  # require script
file-description = 'Difficult Rocket a rocket game'
copyright = 'Copyright © 2020-2025 by shenjackyuanjie 3695888@qq.com'

windows-icon-from-ico = '.\assets\textures\icon.png'
macos-app-icon = '.\assets\textures\icon.png'
linux-icon = './assets/textures/icon.png'

nofollow-import-to = [
    'objprint',
    'PIL',
    'cffi',
    'pydoc',
    'numpy',
    'email',
    'win32con',
    'smtplib',
    'win32evtlog',
    'win32evtlogutil',
    'win32api'
]

include-data-dir = [
    ['config', 'config'],
    ['assets', 'assets']
]
include-package = ['Difficult_Rocket.api']
# DR.api 没有直接 import, 所以需要手动添加

disable-plugin = ['pyqt5', 'tk-inter']
